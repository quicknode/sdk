[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "my-sdk"
version = "0.1.0"
description = "A Rust SDK with Python bindings"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[tool.maturin]
manifest-path = "crates/python/Cargo.toml"
module-name = "my_sdk._core"
python-source = "python"
features = ["pyo3/extension-module"]