[package]
name = "sdk-python"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Python bindings for Quicknode SDK"
publish = false

[lints]
workspace = true

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module", "quicknode-sdk/extension-module"]

[dependencies]
quicknode-sdk = { path = "../core", features = ["python"] }
pyo3 = { workspace = true }
pyo3-async-runtimes = { workspace = true, features = ["tokio-runtime"] }
pyo3-stub-gen = { workspace = true }
serde_json = "1.0"
# serde <-> Python bridge for arbitrary JSON-RPC params/results. Version-locked
# to our pyo3 (0.27); avoids a hand-rolled recursive Value<->PyAny converter.
pythonize = "0.27"
