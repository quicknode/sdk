[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/python",
    "crates/node",
    "crates/python-stubs",
    "crates/ruby",
    "crates/go",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
map_unwrap_or = "warn"
redundant_closure_for_method_calls = "warn"
inefficient_to_string = "warn"
needless_pass_by_value = "warn"

[workspace.dependencies]
pyo3 = { version = "0.27", features = ["experimental-async"] }
pyo3-async-runtimes = { version = "0.27", features = ["tokio-runtime"] }
# Tracks pyo3 versions in lockstep; converts dynamic SQL result rows
# (serde_json::Value) to native Python objects.
pythonize = { version = "0.27" }
napi = { version = "3", features = ["async", "tokio_rt", "compat-mode"] }
napi-derive = { version = "3", features = ["compat-mode"] }
pyo3-stub-gen = { version = "0.19.0" }
magnus = { version = "0.8" }
# Pinned to match the installed uniffi-bindgen-go generator tag
# (v0.7.1+v0.31.0). Do NOT bump ahead of the generator — see CLAUDE.md
# §Architecture → Go Binding (UniFFI).
uniffi = { version = "0.31.0" }
